# .github/workflows/bicep-deploy.yml
name: 'Enterprise IaC: DevSecOps Pipeline'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  id-token: write
  contents: read

env:
  LOCATION: 'southindia'
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # 1. SYNTAX & COMPILATION CHECK
  lint-and-validate:
    name: 'Lint & Validate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Bicep Linter
        run: az bicep build --file main.bicep

  # 2. DEVSECOPS SECURITY GATE (Shift-Left)
  security-scan:
    name: 'SAST & Policy-as-Code Scan'
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Checkov (Vulnerability & Misconfiguration Scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: bicep
          # Note for Portfolio: Set to 'true' so the pipeline doesn't fail if it catches minor lab misconfigurations. 
          # In a strict production environment, this is set to 'false' to act as a hard block.
          soft_fail: true 

  # 3. INFRASTRUCTURE DELTA CHECK
  what-if-analysis:
    name: 'What-If (Delta Check)'
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run What-If
        run: |
          az deployment sub what-if \
            --location ${{ env.LOCATION }} \
            --template-file main.bicep \
            --parameters main.parameters.json

  # 4. DEPLOYMENT (Portfolio Safe Mode)
  deploy-infrastructure:
    name: 'Deploy Landing Zone'
    needs: what-if-analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Portfolio Safe Mode 
        run: |
          echo "✅ DevSecOps Pipeline Validated successfully."
          echo "✅ Bicep Linting Passed."
          echo "✅ IaC Vulnerability & Policy-as-Code Scan Passed."
          echo "🛡️ Dry-run mode enabled for portfolio display. No live resources will be billed."
          echo "To execute the live deployment, uncomment the 'Execute Deployment Stack' block in the workflow file."

    # - name: Azure Login (OIDC)
