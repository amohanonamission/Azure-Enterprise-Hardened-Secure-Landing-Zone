# .github/workflows/bicep-deploy.yml
name: 'Enterprise IaC: Bicep Deployment'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  id-token: write
  contents: read

env:
  LOCATION: 'centralindia'
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  lint-and-validate:
    name: 'Lint & Validate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Bicep Linter
        run: az bicep build --file main.bicep

  what-if-analysis:
    name: 'What-If (Delta Check)'
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run What-If
        run: |
          az deployment sub what-if \
            --location ${{ env.LOCATION }} \
            --template-file main.bicep \
            --parameters main.parameters.json

  # In a real environment, this job would require a manual CAB approval gate
  deploy-infrastructure:
    name: 'Deploy Landing Zone'
    needs: what-if-analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute Deployment Stack
        run: |
          az stack sub create \
            --name "AMPT-2026-Foundation-Stack" \
            --location ${{ env.LOCATION }} \
            --template-file main.bicep \
            --parameters main.parameters.json \
            --deny-settings-mode "denyDelete" \
            --action-on-unmanage "deleteAll" \
            --yes
